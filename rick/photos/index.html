<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Photos from Rick Saunders' Western Wildlands Route ride, Canada to Mexico, organized by segment.">
<title>Rick's WWR Photos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚵</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{color-scheme:light dark;
  --bg:#EEF0EA; --paper:#F7F8F4; --ink:#1B2620; --ink-2:#4B5A52; --ink-3:#7E8B84;
  --line:#CBD3CB; --contour:#DDE3DB; --red:#B4232C;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#131917; --paper:#1B2320; --ink:#E8ECE6; --ink-2:#B3BDB6; --ink-3:#7F8B84; --line:#33403A; --contour:#26312C; --red:#E1555E; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;
  background-image:repeating-linear-gradient(0deg,transparent 0 23px,var(--contour) 23px 24px);}
.wrap{max-width:1040px;margin:0 auto;padding:24px 20px 64px}
a{color:var(--red)}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.nav a{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:3px}
.nav a:hover,.nav a:focus{background:var(--red);color:#fff}
.nav a.on{background:var(--red);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.nav a.on::before{content:"▸ ";opacity:.85}
h1,h2{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:44px;line-height:1;text-transform:uppercase}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--red);font-weight:600}
.sub{color:var(--ink-2);margin-top:6px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
section{margin-top:34px}
h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);margin-bottom:4px}
.segsub{font-size:13px;color:var(--ink-3);margin-bottom:12px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.photos figure{margin:0;background:var(--paper);border:1px solid var(--line)}
.photos a{display:block;line-height:0}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.photos figcaption{padding:8px 10px 10px;font-size:14px;color:var(--ink-2);line-height:1.35}
.photos figcaption .d{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:2px}
.photos .who{float:right;font-size:11px;font-weight:600;letter-spacing:.06em;padding:1px 7px;border-radius:3px;background:var(--contour);color:var(--ink-2)}
.photos .who.rick{background:var(--red);color:#fff}
.empty{font-size:14px;color:var(--ink-3);padding:14px 16px;background:var(--paper);border:1px dashed var(--line)}
/* Collapsible segments: a cover strip with the segment's pick, a summary line, and a caret. */
details.seg{margin-top:18px;background:var(--paper);border:1px solid var(--line)}
details.seg summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:200px 1fr auto;gap:0 16px;align-items:center;min-height:120px}
details.seg summary::-webkit-details-marker{display:none}
details.seg summary .pick{position:relative;width:200px;height:100%;min-height:120px;overflow:hidden;background:var(--contour)}
details.seg summary .pick img{width:100%;height:100%;object-fit:cover;display:block}
details.seg summary .pick.none{display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--ink-3)}
details.seg summary .txt{padding:12px 0;min-width:0}
details.seg summary h2{margin:0}
details.seg summary .segsub{margin:2px 0 0}
details.seg summary .count{font-size:13px;color:var(--ink-2);margin-top:6px}
details.seg summary .count b{color:var(--red);font-weight:600}
details.seg summary .caret{padding:0 18px;font-size:22px;color:var(--ink-3);transition:transform .15s}
details.seg[open] summary .caret{transform:rotate(90deg)}
details.seg[open] summary{border-bottom:1px solid var(--line)}
details.seg .body{padding:14px}
details.seg.upcoming{margin-top:8px}
details.seg.upcoming summary{min-height:0;grid-template-columns:44px 1fr auto}
details.seg.upcoming summary .pick{width:44px;min-height:44px;font-size:20px}
details.seg.upcoming summary h2{font-size:17px}
details.seg.upcoming summary .txt{padding:8px 0}
details.seg.upcoming summary .count{display:none}
details.seg summary:hover .count b,details.seg summary:focus-visible .count b{text-decoration:underline}
@media (max-width:600px){ details.seg.upcoming summary{grid-template-columns:44px 1fr auto} details.seg summary{grid-template-columns:120px 1fr auto} details.seg summary .pick{width:120px;min-height:100px} details.seg summary .caret{padding:0 12px} details.seg .body{padding:10px} .photos{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))} }
.foot{margin-top:40px;font-size:13px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px}
@media (max-width:720px){ h1{font-size:34px} }
</style>
<script data-goatcounter="https://shawnandersonapps.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="../">Tracker</a><a href="../weather/">Weather</a><a class="on" aria-current="page" href="../photos/">Photos</a><a href="../records/">Records</a></div>
  <div class="eyebrow">Western Wildlands Route · Canada to Mexico</div>
  <h1>Photos from the trail</h1>
  <div class="sub" id="sub">Organized by segment. Tap a photo for full size.</div>
  <div id="gallery"></div>
  <div class="foot"><a href="/">shawnandersonapps.com</a> · <a href="../">Back to the tracker</a> · <span id="visits"></span></div>
</div>
<script src="../data.js"></script>
<script>
const d2 = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const mdy = d => d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
const esc = s => s.replace(/"/g,'&quot;');
const segFor = p => p.seg || (SEGMENTS.find(s => d2(p.date) <= d2(s.end)) || SEGMENTS[SEGMENTS.length-1]).n;
const bySeg = {}; PHOTOS.forEach(p => { (bySeg[segFor(p)] = bySeg[segFor(p)] || []).push(p); });
const total = PHOTOS.length;
document.getElementById("sub").textContent = `${total} photo${total===1?"":"s"} so far, newest on top. Tap a segment to open it and a photo for full size. Captions tagged Rick are his own words from the trail; the rest are Shawn's.`;
// Segment picks: the cover photo on each collapsed segment strip (file name from PHOTOS). Falls back to that segment's newest photo.
const PICKS = {1:"2026-09-11-bike-on-trestle", 2:"2026-09-12-superior-exit-sign-selfie"};
const tfmt = t => { if(!t) return ""; const [h,m]=t.split(":").map(Number); return ` · ${((h+11)%12)+1}:${String(m).padStart(2,"0")} ${h<12?"am":"pm"}`; };
const key = p => p.date + " " + (p.time || "99:99");
// Newest segment on top. Within a segment newest first; within a day, timed photos sort by time and untimed ones follow in PHOTOS order.
// Segments with photos first (newest on top), then the empty upcoming ones as slim rows underneath.
const withPhotos = SEGMENTS.slice().reverse().filter(s => (bySeg[s.n]||[]).length);
const withoutPhotos = SEGMENTS.filter(s => !(bySeg[s.n]||[]).length);
const segsNewestFirst = withPhotos.concat(withoutPhotos);
const firstWithPhotos = segsNewestFirst.find(s => (bySeg[s.n]||[]).length);
document.getElementById("gallery").innerHTML = segsNewestFirst.map(s => {
  const ps = (bySeg[s.n]||[]).map((p,i)=>({p,i})).sort((a,b)=> key(a.p)<key(b.p)?1: key(a.p)>key(b.p)?-1: a.i-b.i).map(x=>x.p);
  const pick = ps.find(p => p.file===PICKS[s.n]) || ps[0];
  const open = s===firstWithPhotos ? " open" : "";
  const days = new Set(ps.map(p=>p.date)).size;
  const body = ps.length
    ? `<div class="photos">${ps.map(p=>`<figure><a href="${p.file}.jpg" target="_blank" rel="noopener"><img src="${p.file}-thumb.jpg" alt="${esc(p.caption)}" loading="lazy"></a><figcaption><span class="d">${mdy(d2(p.date))}${tfmt(p.time)}<span class="who ${p.by==="rick"?"rick":"home"}">${p.by==="rick"?"Rick":"Shawn"}</span></span>${p.caption}</figcaption></figure>`).join("")}</div>`
    : `<div class="empty">Nothing from this stretch yet.</div>`;
  const count = ps.length ? `<b>${ps.length} photo${ps.length===1?"":"s"}</b> over ${days} day${days===1?"":"s"}${pick?`, ${mdy(d2(ps[ps.length-1].date))} to ${mdy(d2(ps[0].date))}`:""}` : `No photos yet`;
  return `<details class="seg${ps.length?"":" upcoming"}"${open}><summary>${pick?`<div class="pick"><img src="${pick.file}-thumb.jpg" alt="" loading="lazy"></div>`:`<div class="pick none">🚵</div>`}<div class="txt"><h2>Segment ${s.n}: ${s.from} to ${s.to}</h2><div class="segsub">${mdy(d2(s.start))} to ${mdy(d2(s.end))} · ${s.miles.toLocaleString()} mi</div><div class="count">${count}</div></div><div class="caret">▸</div></summary><div class="body">${body}</div></details>`;
}).join("");
</script>
<script>
(function(){ var el=document.getElementById("visits"); if(!el) return;
  fetch("https://shawnandersonapps.goatcounter.com/counter/TOTAL.json").then(r=>r.json()).then(j=>{ el.textContent = String(j.count).replace(/\s/g,",") + " visits since Sept 6"; }).catch(()=>{ el.remove(); });
})();
</script>
</body>
</html>
